<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RULES</title>
<meta name="robots" content="noindex">
<style>
:root{--fg:#b9b9b4;--dim:#4a4a48;--hi:#fff;--bg:#000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:"JetBrains Mono","Courier New",Courier,monospace;font-size:15px;line-height:1.7}
body{overflow-x:hidden}
::selection{background:#fff;color:#000}
@media (pointer:fine){*{cursor:none!important}}

/* ---------- atmosphere ---------- */
#scan,#vig,#grain,#dust{position:fixed;inset:0;pointer-events:none}
#scan{z-index:9000;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.28) 3px);mix-blend-mode:multiply}
#vig{z-index:9001;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.65) 80%,#000 110%)}
#grain{z-index:9002;opacity:.10;width:200%;height:200%;inset:auto;top:-50%;left:-50%;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
 animation:grain .9s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-5%,3%)}40%{transform:translate(4%,-6%)}60%{transform:translate(-3%,5%)}80%{transform:translate(6%,2%)}100%{transform:translate(0,0)}}
#dust{z-index:8999;width:100%;height:100%}
#flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:9500;pointer-events:none}
#cur{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;z-index:9999;pointer-events:none;mix-blend-mode:difference;display:none}
#cur::before,#cur::after{content:"";position:absolute;background:#fff}
#cur::before{left:10px;top:0;width:1px;height:22px}
#cur::after{top:10px;left:0;height:1px;width:22px}
@media (pointer:fine){#cur{display:block}}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:9400;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;transition:opacity 2.2s ease}
#gate.out{opacity:0;pointer-events:none}
#gate small{color:var(--dim);letter-spacing:.3em;font-size:11px;margin-bottom:2.2rem;display:block}
#enter{background:none;border:1px solid var(--dim);color:var(--fg);font:inherit;letter-spacing:.35em;padding:1rem 1.8rem;transition:all .25s}
#enter:hover{background:#fff;color:#000;border-color:#fff}
#gate p{margin-top:2.2rem;color:var(--dim);font-size:11px;letter-spacing:.15em}

/* ---------- content ---------- */
main{max-width:720px;margin:0 auto;padding:18vh 1.5rem 40vh}
header{margin-bottom:14vh}
header h1{font-weight:400;letter-spacing:.5em;font-size:13px;color:var(--hi);margin-bottom:1rem}
header p{color:var(--dim);font-size:12px;letter-spacing:.1em;max-width:46ch}
.rule{display:flex;gap:1.6rem;margin-bottom:3.4rem;opacity:0;transform:translateY(6px);transition:opacity 1.6s ease,transform 1.6s ease}
.rule.in{opacity:1;transform:none}
.num{flex:0 0 3.6rem;color:var(--dim);text-align:right;font-size:12px;padding-top:.15rem;user-select:none}
.txt{flex:1;word-break:break-word}
.redact{background:#1b1b1b;color:#1b1b1b;user-select:none;transition:color .1s,background .1s}
.redact:hover{color:#777}
.glitch .txt{animation:jit 2.4s steps(1) infinite}
@keyframes jit{
 0%,86%,100%{transform:none;text-shadow:none}
 88%{transform:translateX(-3px);text-shadow:2px 0 #7a0000,-2px 0 #004a5a}
 90%{transform:translateX(4px) skewX(-6deg);text-shadow:-3px 0 #7a0000,3px 0 #004a5a}
 92%{transform:translateY(1px);color:#fff}
 94%{transform:none;text-shadow:none}}
.hot .txt{color:var(--hi)}
#sentinel{height:2px}
#hud{position:fixed;top:1rem;right:1.2rem;z-index:9100;font-size:11px;letter-spacing:.2em;color:var(--dim);mix-blend-mode:difference}
#snd{position:fixed;left:1.2rem;bottom:1rem;z-index:9100;background:none;border:0;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.2em}
#snd:hover{color:#fff}
@media (max-width:560px){.rule{gap:.8rem}.num{flex-basis:2.6rem}}
@media (prefers-reduced-motion:reduce){#grain{animation:none}.glitch .txt{animation:none}}
</style>
<script src="scares.js" defer></script>
</head>
<body>

<div id="gate">
  <small>// SIGNAL DETECTED &nbsp;·&nbsp; HEADPHONES RECOMMENDED</small>
  <button id="enter">[ CLICK TO PROCEED ]</button>
  <p>THERE ARE RULES. YOU WILL FOLLOW THEM.</p>
</div>

<!-- Put your MP3 next to index.html and name it ambience.mp3 -->
<audio id="amb" src="viLe.mp3" loop preload="auto"></audio>

<div id="hud">READ: 0</div>
<button id="snd" aria-label="toggle sound">[ SOUND: OFF ]</button>
<canvas id="dust"></canvas>
<div id="flash"></div>
<div id="scan"></div>
<div id="vig"></div>
<div id="grain"></div>
<div id="cur"></div>

<main>
  <header>
    <h1>RULES</h1>
    <p>THIS LIST IS NOT FINISHED. IT HAS NEVER BEEN FINISHED. DO NOT SKIP AHEAD. DO NOT STOP.</p>
  </header>
  <section id="list"></section>
  <div id="sentinel"></div>
</main>

<script>
(() => {
  const R = Math.random, rint = n => Math.floor(R() * n), pick = a => a[rint(a.length)];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  /* ================= RULE POOLS ================= */
  const SEED = [
    "Do not look directly at the lights in the corridor after 23:00.",
    "If someone calls your name from another room, do not answer. Count to eleven. If they call again, answer in a different voice.",
    "The stairwell has twelve steps. If you count thirteen, you are not on the stairwell.",
    "Keep the radio on. If it begins to play your own voice, turn it off and leave the room backwards.",
    "Do not trust any reflection that blinks after you do.",
    "Staff will never ask you to sign anything. Do not sign anything.",
    "If the building is quiet, this is normal. If the building is silent, this is not.",
    "Do not eat anything that was left out for you.",
    "The photograph on the third floor is not of anyone you know. It is not of anyone.",
    "If you find a door that was not there yesterday, do not open it. Note the time.",
    "Never share an elevator with someone who is smiling.",
    "The sound of tape rewinding in an empty room is a courtesy. Do not thank it.",
    "If asked how long you have been here, answer: \"since the start of the shift.\" Do not say a number.",
    "Your shadow should fall away from the light. Report any deviation to no one.",
    "Do not read these rules aloud.",
    "The night staff are not permitted to enter the east wing. If you see one there, they are not staff.",
    "Water should be clear. If it is not, do not ask what it was before.",
    "There are no rules concerning the basement. There never were.",
    "If the rules appear to change, they have not. You have.",
    "Do not scroll quickly."
  ];

  const SOUNDS = ["breathing","tape hiss","a child counting","footsteps overhead","your name","a dial tone","slow applause","humming","a door closing softly","static shaped like speech","someone typing","a music box"];
  const PLACES = ["the ceiling","the vent","the east corridor","the locked room","behind the wall","the lower floors","the empty bed","the telephone","the television","beneath the floor","the room next door","the elevator shaft"];
  const ACTS = ["do not respond","leave the room without turning around","turn off every light and wait","write down the time and tell no one","hold your breath until it stops","close your eyes and count to forty","look at the floor","leave the door open","unplug it","say nothing","walk away at a steady pace","apologize, quietly"];
  const VERBS = ["look at","speak to","answer","photograph","touch","follow","remember","name","thank","wave at"];
  const THINGS = ["the lamp in the hallway","the man at the end of the corridor","the thing in the mirror","the night shift","the recording","the child in the photograph","the second moon","the door marked 0","the voice from the vent","the person wearing your coat","the other you","the smiling attendant"];
  const TIMES = ["03:00","the lights flicker","the third knock","the tape ends","the rain stops","dusk","you stop hearing the hum","the clocks disagree"];
  const STATES = ["locked","silent","unobserved","warm","facing the wall","left alone","dry","counted"];
  const PLURALS = ["windows","chairs","faces","stairs","people","lights","doors","mirrors"];

  const T1 = [
    () => `If you hear ${pick(SOUNDS)} coming from ${pick(PLACES)}, ${pick(ACTS)}.`,
    () => `Do not ${pick(VERBS)} ${pick(THINGS)} after ${pick(TIMES)}.`,
    () => `${cap(pick(THINGS))} should remain ${pick(STATES)}. If it is not, ${pick(ACTS)}.`,
    () => `There are ${rint(9)+3} ${pick(PLURALS)} in ${pick(PLACES)}. If you count ${rint(9)+3}, ${pick(ACTS)}.`,
    () => `Between ${pick(["01:00","02:14","03:33","04:00"])} and dawn, ${pick(ACTS)}.`
  ];
  const T2S = [
    "The attendant has been replaced. Do not mention that you noticed.",
    "If you remember a room you have never visited, you are being remembered back.",
    "Do not count the people in the photograph. The number changes if you do.",
    "Anything that thanks you by name is lying about the name.",
    "If the hum stops, it is listening. If the hum resumes, it has finished.",
    "The walls are warm because they are not walls.",
    "A second set of footsteps is acceptable. A third is not.",
    "Do not describe the thing in the corridor. Descriptions are invitations.",
    "You may sleep. You may not dream of the stairwell.",
    "If your reflection is smiling, smile back. Do not stop smiling until it does.",
    "Dust that settles in patterns is a message. Do not read it.",
    "Your name is on a list. It is not the list you are reading.",
    "Teeth are not a sign of friendliness.",
    "If you are given a key, you have been given a door."
  ];
  const T2 = [() => pick(T2S), () => pick(window.EX_A||T2S), () => pick(window.EX_B||T2S), ...T1];
  const T3S = [
    "You have been here longer than you think.",
    "It is reading this with you.",
    "The scrolling is not your idea.",
    "Do not trust the number on the left.",
    "There is no bottom. There was never a bottom.",
    "It knows how far you have scrolled.",
    "Close this page. Close it. You are still reading.",
    "Your screen is a window. Windows go both ways.",
    "Do not look at the dark parts of the screen.",
    "We are sorry. We are so sorry.",
    "Stop. Go back up. It is behind you now.",
    "Someone has been scrolling this page before you. You are on their page.",
    "Do not turn around. The chair is not creaking.",
    "You were not supposed to get this far.",
    "Look at your hands. Look at them again.",
    "The rules are not for you. They are for what is standing next to you."
  ];
  const T3 = [
    () => pick(T3S), () => pick(window.EX_B||T3S), () => pick(window.EX_B||T3S), () => pick(window.EX_A||T3S),
    () => `You have read ${depth} rules. ${pick(["It is enough.","It is not enough.","It is counting too.","It has stopped counting."])}`,
    () => `Rule ${rint(depth)+1} was removed. You are not permitted to know what it said.`,
    () => pick(T2S)
  ];

  /* ================= CORRUPTION ================= */
  const ZUP = ["\u030d","\u030e","\u0304","\u0305","\u033f","\u0311","\u0306","\u0310","\u0352","\u0357","\u0351","\u0307","\u0308","\u030a","\u0342","\u0343","\u0344","\u034a","\u034b","\u034c","\u0303","\u0302","\u030c","\u0350","\u0300","\u0301","\u030b","\u030f","\u0312","\u0313","\u0314","\u033d","\u0309","\u0363","\u0364","\u0365"];
  const ZMID = ["\u0315","\u031b","\u0340","\u0341","\u0358","\u0321","\u0322","\u0327","\u0328","\u0334","\u0335","\u0336","\u0337","\u0338"];
  const ZDN = ["\u0316","\u0317","\u0318","\u0319","\u031c","\u031d","\u031e","\u031f","\u0320","\u0324","\u0325","\u0326","\u0329","\u032a","\u032b","\u032c","\u032d","\u032e","\u032f","\u0330","\u0331","\u0332","\u0333","\u0339","\u033a","\u033b","\u033c","\u0345","\u0347","\u0348","\u0349","\u034d","\u034e","\u0353","\u0354","\u0355","\u0356","\u0359","\u035a","\u0323"];
  const NOISE = "▓▒░█#@%&¤§¿?¦|/\\<>_";
  const zalgo = (s, k) => [...s].map(ch => {
    if (ch === " ") return ch;
    let o = ch, n = Math.floor(R() * k * 5);
    while (n--) { const z = pick([ZUP, ZMID, ZDN]); o += pick(z); }
    return o;
  }).join("");
  const noisify = (s, p) => [...s].map(ch => (ch !== " " && R() < p) ? pick([...NOISE]) : ch).join("");

  let depth = 0;           // rules generated so far
  const level = n => Math.min(1, n / 350);

  function genText(n) {
    const c = level(n);
    if (n <= SEED.length) return SEED[n - 1];
    const r = R();
    const tier = c < .12 ? (r < .85 ? 1 : 2) : c < .45 ? (r < .35 ? 1 : 2) : (r < .15 ? 2 : 3);
    return pick(tier === 1 ? T1 : tier === 2 ? T2 : T3)();
  }

  function numLabel(n) {
    const c = level(n);
    if (c > .2 && R() < (c - .2) * .45) {
      return pick([String(n - 1), String(n + rint(60)), "∅", "??", "-" + n, "0", "NaN", "█".repeat(String(n).length), "nnn".replace(/n/g, () => rint(10))]);
    }
    return String(n);
  }

  function buildRule(n) {
    const c = level(n);
    let text = genText(n);

    if (c > .15 && R() < c * .6) text = zalgo(text, c * (R() < .15 ? 1.6 : .7));
    if (c > .1) text = noisify(text, c * .05);

    const el = document.createElement("div");
    el.className = "rule";
    const num = document.createElement("span"); num.className = "num";
    num.textContent = numLabel(n).padStart(3, "0").slice(-6);
    const txt = document.createElement("span"); txt.className = "txt";

    // redaction by word
    const words = text.split(" ");
    words.forEach((w, i) => {
      if (c > .08 && w.length > 2 && R() < c * .32) {
        const s = document.createElement("span");
        s.className = "redact"; s.textContent = "█".repeat([...w].length);
        txt.appendChild(s);
      } else txt.appendChild(document.createTextNode(w));
      if (i < words.length - 1) txt.appendChild(document.createTextNode(" "));
    });

    // whole-rule redaction (very deep)
    if (c > .5 && R() < (c - .5) * .35) {
      txt.textContent = "";
      const s = document.createElement("span"); s.className = "redact";
      s.textContent = "█".repeat(12 + rint(60)); txt.appendChild(s);
    }

    el.append(num, txt);
    if (!reduce && c > .1 && R() < c * .4) el.classList.add("glitch");
    if (c > .4 && R() < .08) el.classList.add("hot");
    el._orig = text;
    return el;
  }

  /* ================= INFINITE SCROLL ================= */
  const list = document.getElementById("list");
  const sentinel = document.getElementById("sentinel");
  const hud = document.getElementById("hud");
  const reveal = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); reveal.unobserve(e.target); }
  }), { threshold: .15 });

  function append(count = 10) {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      depth++;
      const el = buildRule(depth);
      frag.appendChild(el);
      reveal.observe(el);
    }
    list.appendChild(frag);
    updateHud();
  }
  function updateHud() {
    const c = level(depth);
    window.__d = depth; hud.textContent = "READ: " + (c > .6 && R() < .5 ? zalgo(String(depth), c) : depth);
    if (amb && !amb.paused && !amb.error) {
      try { amb.preservesPitch = false; amb.playbackRate = 1 - c * .12; } catch (e) {}
    }
  }
  const loader = new IntersectionObserver(es => {
    if (es[0].isIntersecting) {
      append(10);
      loader.unobserve(sentinel); loader.observe(sentinel); // re-fire if still visible
    }
  }, { rootMargin: "1400px 0px" });
  loader.observe(sentinel);

  /* ================= GLITCH EVENTS ================= */
  const flash = document.getElementById("flash");
  let lastFlash = 0;
  function doFlash() {
    if (reduce) return;
    const now = performance.now(); if (now - lastFlash < 9000) return;
    lastFlash = now;
    flash.style.transition = "none"; flash.style.opacity = .85;
    setTimeout(() => { flash.style.transition = "opacity .25s"; flash.style.opacity = 0; }, 55);
  }
  setInterval(() => {
    const c = level(depth);
    if (c <= 0.03) return;
    const vis = [...list.querySelectorAll(".rule.in")].filter(r => {
      const b = r.getBoundingClientRect(); return b.bottom > 0 && b.top < innerHeight;
    });
    if (vis.length && R() < .25 + c * .5) {
      const r = pick(vis), t = r.querySelector(".txt"), keep = t.innerHTML;
      t.textContent = zalgo(pick(T3S), .6 + c);
      setTimeout(() => { t.innerHTML = keep; }, 90 + rint(160));
    }
    if (c > .15 && R() < c * .12) doFlash();
    if (c > .25 && R() < .3) {
      document.title = R() < .5 ? zalgo("RULES", c) : pick(["behind you","keep reading","RULES","don't stop","█████"]);
      setTimeout(() => document.title = "RULES", 700);
    }
  }, 2600);

  /* ================= CURSOR ================= */
  const cur = document.getElementById("cur");
  addEventListener("mousemove", e => {
    const j = level(depth) * 3;
    cur.style.transform = `translate(${e.clientX + (R() - .5) * j}px,${e.clientY + (R() - .5) * j}px)`;
  });

  /* ================= DUST ================= */
  const cv = document.getElementById("dust"), cx = cv.getContext("2d");
  let W, H, motes = [];
  function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener("resize", size); size();
  for (let i = 0; i < 55; i++) motes.push({ x: R() * W, y: R() * H, r: R() * 1.3 + .3, vx: (R() - .5) * .15, vy: R() * .12 + .02, a: R() * .35 + .05 });
  (function loop() {
    cx.clearRect(0, 0, W, H);
    if (!reduce) for (const m of motes) {
      m.x += m.vx; m.y += m.vy;
      if (m.y > H) { m.y = -2; m.x = R() * W; } if (m.x < 0) m.x = W; if (m.x > W) m.x = 0;
      cx.fillStyle = `rgba(200,200,190,${m.a})`;
      cx.beginPath(); cx.arc(m.x, m.y, m.r, 0, 6.283); cx.fill();
    }
    requestAnimationFrame(loop);
  })();

  /* ================= AUDIO ================= */
  const amb = document.getElementById("amb");
  const snd = document.getElementById("snd");
  const TARGET = .55;
  let soundOn = false, fadeT = null, droneCtx = null;

  function fadeTo(v, ms) {
    clearInterval(fadeT);
    const start = amb.volume, steps = 40, dt = ms / steps; let i = 0;
    fadeT = setInterval(() => {
      i++; amb.volume = Math.max(0, Math.min(1, start + (v - start) * (i / steps)));
      if (i >= steps) { clearInterval(fadeT); if (v === 0) amb.pause(); }
    }, dt);
  }
  // fallback low drone if ambience.mp3 is missing
  function drone() {
    if (droneCtx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; droneCtx = new AC();
      const g = droneCtx.createGain(); g.gain.value = 0; g.connect(droneCtx.destination);
      [48, 48.4, 72.3].forEach((f, i) => { const o = droneCtx.createOscillator(); o.type = i === 2 ? "triangle" : "sine"; o.frequency.value = f; o.connect(g); o.start(); });
      g.gain.linearRampToValueAtTime(.08, droneCtx.currentTime + 6);
    } catch (e) {}
  }
  function soundStart() {
    soundOn = true; snd.textContent = "[ SOUND: ON ]";
    amb.volume = 0;
    const p = amb.play();
    if (p && p.catch) p.catch(drone);
    amb.addEventListener("error", drone, { once: true });
    fadeTo(TARGET, 7000);
  }
  function soundStop() { soundOn = false; snd.textContent = "[ SOUND: OFF ]"; fadeTo(0, 1200); if (droneCtx) droneCtx.suspend(); }
  snd.addEventListener("click", () => soundOn ? soundStop() : (droneCtx && droneCtx.resume(), soundStart()));

  /* ================= ENTRY ================= */
  document.getElementById("enter").addEventListener("click", () => {
    document.getElementById("gate").classList.add("out");
    soundStart();
    append(14);
  });
  // lock scroll behind gate until entered
  document.documentElement.style.overflow = "hidden";
  document.getElementById("enter").addEventListener("click", () => document.documentElement.style.overflow = "", { once: true });
})();
</script>
</body>
</html>
